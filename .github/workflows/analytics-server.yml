# Builds the analytics server for Fly.io's machines, and proves it works on Linux.
# `loamc` has no cross target, so the binary has to be built on Linux. See phase 7 of
# docs/site-analytics.md. This does not deploy.
#
# It runs by hand only, not on pushes or PRs. Before `www/deploy.sh server`, push,
# then run: gh workflow run analytics-server.yml --ref <branch>

name: analytics server

on:
  # push:
  #   branches: [master, feat/zeus-web-site-tracking]
  #   paths:
  #     - .github/workflows/analytics-server.yml
  #     - Makefile
  #     - nob.loam
  #     - www/server/**
  #     - packages/crypto/**
  #     - packages/http/**
  #     - packages/loam/**
  #     - packages/sqlite/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the compiler
        run: make bin/nob

      - name: Run the server's tests
        run: |
          for filter in crypto sqlite http_listen www_analytics; do
            ./bin/nob test "$filter"
          done

      # Static, so it does not depend on the base image's C library.
      - name: Build the binaries
        env:
          LOAM_LINK_EXTRA: -static
        run: |
          ./bin/loamc www/server/main.loam -o analytics
          ./bin/loamc www/server/hash_password.loam -o hash-password

      - name: Check that the binary is static
        run: |
          file analytics
          ! ldd analytics

      - name: Run the binary
        run: www/server/smoke.sh ./analytics ./hash-password

      - uses: actions/upload-artifact@v4
        with:
          name: analytics-linux-x86_64
          path: analytics
          if-no-files-found: error
          retention-days: 14
