# Self-hosting platform check (docs/self-hosting-loam.md §1.6, §3): the suite on
# Linux x86_64 and aarch64, and the non-GUI fixtures built and *run* natively on
# Windows x86_64.
#
# Runs on pull requests that target master, and by hand; never on push.
# Standard GitHub-hosted runners are free for public repositories.
#
# Every OS bootstraps the same way from the checkout alone: `./nob.sh` compiles
# the committed seed, bootstrap/loamc.c (the Loam compiler's own C), into
# bin/loamc0, which builds bin/loamc from packages/loam/compiler. On Linux
# `nob` then runs the suite. On Windows (MinGW-w64 gcc; `nob` needs a POSIX
# shell) that compiler emits each fixture's C (tools/win-bundle.sh); the
# fixtures are built and run (tools/win-run.sh); it builds itself again, which
# reaches the fixed point, and builds and runs the fixtures through its own
# driver (tools/win-selfhost.sh). The same-c job then checks that Windows
# emitted the same C as Linux for the compiler and every fixture. Linux checks
# the seed and the fixed point (`selfhost_seed`) in the selfhost job, on
# x86_64 and aarch64. See docs/platforms.md.

name: selfhost

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libx11-dev pkg-config

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the compiler from the seed, and the tools
        run: ./nob.sh

      - name: Test suite
        run: ./nob.sh test

      - name: Bundle fixtures for Windows
        if: matrix.os == 'ubuntu-24.04'
        run: tools/win-bundle.sh out/win-bundle

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: win-bundle
          path: out/win-bundle
          retention-days: 3

  selfhost:
    strategy:
      fail-fast: false
      matrix:
        stanza: [selfhost_seed]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libx11-dev pkg-config

      - name: Build the compiler from the seed, and the tools
        run: ./nob.sh

      - name: ${{ matrix.stanza }}
        run: ./nob.sh selfhost ${{ matrix.stanza }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc diffutils

      - name: Build bin/loamc from the committed seed (bootstrap/loamc.c -> bin/loamc0 -> bin/loamc)
        run: ./nob.sh

      - name: Emit the fixtures' C with it
        run: sh tools/win-bundle.sh win-bundle

      - name: Build and run the fixtures natively
        run: bash tools/win-run.sh win-bundle

      - name: The compiler builds itself; fixed point
        run: bash tools/win-selfhost.sh win-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: win-bundle-windows
          path: win-bundle
          retention-days: 3

  # Generated C must be the same bytes on every OS: the compiler's own and
  # every fixture's, Windows against Linux.
  same-c:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-bundle
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: win-bundle-windows
          path: windows
      - name: Compare
        run: |
          diff <(cd linux && ls *.c loamc.c.txt) <(cd windows && ls *.c loamc.c.txt)
          for f in linux/*.c linux/loamc.c.txt; do cmp "$f" "windows/${f#linux/}"; done
          echo "same C on Linux and Windows: $(ls linux/*.c | wc -l) fixtures and the compiler"
