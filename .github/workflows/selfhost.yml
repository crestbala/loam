# Self-hosting platform check (docs/self-hosting-loam.md §1.6, §3): the suite on
# Linux x86_64 and aarch64, and the non-GUI fixtures built and *run* natively on
# Windows x86_64.
#
# Runs on pull requests whose branch is feat/self-hosting (any other PR skips it
# without starting a runner) and by hand. Standard GitHub-hosted runners are free
# for public repositories.
#
# The C compiler's driver is POSIX, so Windows builds from the checkout alone
# through the committed seed: `./nob.sh` compiles bootstrap/loamc.c (the Loam
# compiler's own C) with MinGW-w64 gcc into bin/loamc. That compiler emits
# each fixture's C (tools/win-bundle.sh); the fixtures are built and run
# (tools/win-run.sh); it builds the current compiler, which reaches the fixed
# point and builds and runs the fixtures through its own driver
# (tools/win-selfhost.sh). The same-c job then checks that Windows emitted the
# same C as Linux for the compiler and every fixture. Linux checks the fixed
# point (`selfhost_driver`, `selfhost_seed`) in the selfhost job. See
# docs/platforms.md.
#
# `./nob.sh test` leaves out the self-hosting stanzas (the Loam compiler against
# the C one, and the fixed point): they are nearly all of a full run's time. The
# selfhost job runs each on its own runner, beside the test job, so the
# workflow takes about as long as the slowest stanza, not their sum.

name: selfhost

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/self-hosting'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libx11-dev pkg-config

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the seed compiler and tools
        run: ./nob.sh

      - name: Test suite
        run: ./nob.sh test

      - name: Bundle fixtures for Windows
        if: matrix.os == 'ubuntu-24.04'
        run: tools/win-bundle.sh out/win-bundle

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: win-bundle
          path: out/win-bundle
          retention-days: 3

  selfhost:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/self-hosting'
    strategy:
      fail-fast: false
      matrix:
        stanza: [selfhost_lex, selfhost_parse, selfhost_load, selfhost_passes, selfhost_driver, selfhost_seed]
        os: [ubuntu-24.04]
        include:
          # The fixed point on aarch64 too.
          - stanza: selfhost_driver
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libx11-dev pkg-config

      - name: Build the seed compiler and tools
        run: ./nob.sh

      - name: ${{ matrix.stanza }}
        run: ./nob.sh selfhost ${{ matrix.stanza }}

  windows:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/self-hosting'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc diffutils

      - name: Build bin/loamc from the committed seed
        run: ./nob.sh

      - name: Emit the fixtures' C with it
        run: sh tools/win-bundle.sh win-bundle

      - name: Build and run the fixtures natively
        run: bash tools/win-run.sh win-bundle

      - name: Build the current compiler from the seed; fixed point
        run: bash tools/win-selfhost.sh win-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: win-bundle-windows
          path: win-bundle
          retention-days: 3

  # Generated C must be the same bytes on every OS: the compiler's own and
  # every fixture's, Windows (seed-built compiler) against Linux (C compiler).
  same-c:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-bundle
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: win-bundle-windows
          path: windows
      - name: Compare
        run: |
          diff <(cd linux && ls *.c loamc.c.txt) <(cd windows && ls *.c loamc.c.txt)
          for f in linux/*.c linux/loamc.c.txt; do cmp "$f" "windows/${f#linux/}"; done
          echo "same C on Linux and Windows: $(ls linux/*.c | wc -l) fixtures and the compiler"
